<svg width="880" height="580" viewBox="0 0 880 580" xmlns="http://www.w3.org/2000/svg">
  <!-- Width=880 Height=580 (if you add more content, increase Height accordingly) -->
  <!-- Content now prints line-by-line, 1s apart, starting at 1.5s. Last line appears ~18.5s; final cursor at 19.5s -->
   <!--
    ASCII e texto com o MESMO font-size (12px).
    Texto: espacamento original (y = 105 ... 489).
    ASCII: 26 linhas esticadas de y=105 a y=489 (passo 15.36px), logo o topo e o fundo
    alinham com a primeira e a ultima linha de texto.
    Coluna do texto em x=402 (ascii: x=30 + 50 chars * 7.2px = 390, + 12px de gap).
  -->
  <style>
    /* ---- Catppuccin Frappé palette ---- */
    :root {
      --ctp-base: #303446;
      --ctp-mantle: #292c3c;
      --ctp-crust: #232634;
      --ctp-text: #c6d0f5;
      --ctp-subtext0: #a5adce;
      --ctp-surface1: #51576d;
      --ctp-red: #e78284;
      --ctp-yellow: #e5c890;
      --ctp-green: #a6d189;
      --ctp-blue: #8caaee;
      --ctp-mauve: #ca9ee6;
      --ctp-pink: #f4b8e4;
      --ctp-lavender: #babbf1;
    }
 
    .bg { fill: var(--ctp-base); }
    .titlebar { fill: var(--ctp-mantle); }
    text { font-family: 'Fira Code', 'DejaVu Sans Mono', 'Courier New', monospace; }
 
    /* ---- Prompt line "~ $> fabiofetch" ---- */
    .prompt-sym { fill: var(--ctp-lavender); font-size: 16px; }
    .prompt-cmd { fill: var(--ctp-green); font-size: 16px; }
 
    .type-clip-rect {
      animation: typewriter 1s steps(10, end) forwards;
    }
    @keyframes typewriter {
      from { width: 0; }
      to   { width: 110px; }
    }
 
    /* ---- Blinking cursor WHILE typing (disappears once content starts printing) ---- */
    .typing-cursor {
      fill: var(--ctp-green);
      animation: typing-cursor-move 1s steps(10, end) forwards,
                 blink 0.9s step-end infinite,
                 hide-cursor 0.01s linear forwards;
      animation-delay: 0s, 0s, 1.15s;
    }
    @keyframes typing-cursor-move {
      from { transform: translateX(0px); }
      to   { transform: translateX(110px); }
    }
    @keyframes hide-cursor {
      to { opacity: 0; }
    }
 
    @keyframes fadein {
      to { opacity: 1; }
    }
 
    /* ---- Each output line fades in individually. --delay is set per element ---- */
    .print-line {
      opacity: 0;
      animation: fadein 0.15s ease forwards;
      animation-delay: var(--delay);
    }
 
    /* Mesmo tamanho de fonte (12px) em tudo */
    .ascii  { fill: var(--ctp-subtext0); font-size: 12px; white-space: pre; }
    .header { fill: var(--ctp-pink);     font-size: 12px; font-weight: bold; white-space: pre; }
    .label  { fill: var(--ctp-blue);     font-size: 12px; white-space: pre; }
    .value  { fill: var(--ctp-text);     font-size: 12px; white-space: pre; }
    .sep    { fill: var(--ctp-surface1); font-size: 12px; white-space: pre; }
 
    /* ---- Final prompt line + blinking cursor (after everything has printed) ---- */
    .final-prompt {
      opacity: 0;
      animation: fadein 0.2s ease forwards;
      animation-delay: 9.5s;
    }
    .final-cursor {
      fill: var(--ctp-green);
      opacity: 0;
      animation: fadein 0.2s ease forwards, blink 0.9s step-end infinite;
      animation-delay: 9.5s, 9.5s;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
 
  <!-- Terminal Window -->
  <rect class="bg" x="0" y="0" width="880" height="580" rx="10"/>
  <rect class="titlebar" x="0" y="0" width="880" height="34" rx="10"/>
  <rect class="titlebar" x="0" y="24" width="880" height="10"/>
  <circle cx="22" cy="17" r="6" fill="#e78284"/>
  <circle cx="44" cy="17" r="6" fill="#e5c890"/>
  <circle cx="66" cy="17" r="6" fill="#a6d189"/>
 
  <!-- Prompt with typing effect -->
  <text x="30" y="65" class="prompt-sym">~ $&gt;</text>
  <clipPath id="typeClip">
    <rect class="type-clip-rect" x="76" y="50" height="22" width="0"/>
  </clipPath>
  <text x="76" y="65" class="prompt-cmd" clip-path="url(#typeClip)">fabiofetch</text>
  <rect class="typing-cursor" x="76" y="52" width="8" height="16"/>
 
  <g>
    <!-- ASCII art: 26 linhas, y de 105 a 489 (passo 15.36) -->
    <text class="ascii print-line" x="30" y="105"    xml:space="preserve" style="--delay:1.5s">..................................................</text>
    <text class="ascii print-line" x="30" y="120.36" xml:space="preserve" style="--delay:1.5s">...........................................+*##:..</text>
    <text class="ascii print-line" x="30" y="135.72" xml:space="preserve" style="--delay:1.5s">........................................:+*#%%#%:.</text>
    <text class="ascii print-line" x="30" y="151.08" xml:space="preserve" style="--delay:1.5s">.......................................*#%%%**:...</text>
    <text class="ascii print-line" x="30" y="166.44" xml:space="preserve" style="--delay:1.5s">......................................=#*%%=......</text>
    <text class="ascii print-line" x="30" y="181.8"  xml:space="preserve" style="--delay:1.5s">....................................+**:..........</text>
    <text class="ascii print-line" x="30" y="197.16" xml:space="preserve" style="--delay:1.5s">..................................==+-............</text>
    <text class="ascii print-line" x="30" y="212.52" xml:space="preserve" style="--delay:1.5s">............................ ...=**-..............</text>
    <text class="ascii print-line" x="30" y="227.88" xml:space="preserve" style="--delay:1.5s">..............................+*==................</text>
    <text class="ascii print-line" x="30" y="243.24" xml:space="preserve" style="--delay:1.5s">............................++-=..................</text>
    <text class="ascii print-line" x="30" y="258.6"  xml:space="preserve" style="--delay:1.5s">..........................++-=:...................</text>
    <text class="ascii print-line" x="30" y="273.96" xml:space="preserve" style="--delay:1.5s">........................=-++:.....................</text>
    <text class="ascii print-line" x="30" y="289.32" xml:space="preserve" style="--delay:1.5s">..............:#%%%%%+==**:.......................</text>
    <text class="ascii print-line" x="30" y="304.68" xml:space="preserve" style="--delay:1.5s">..............#%%%%%*+=*=.........................</text>
    <text class="ascii print-line" x="30" y="320.04" xml:space="preserve" style="--delay:1.5s">.............*%%*=*+=++*..........................</text>
    <text class="ascii print-line" x="30" y="335.4"  xml:space="preserve" style="--delay:1.5s">.....:+#%%%%%%%#-::==#*...........................</text>
    <text class="ascii print-line" x="30" y="350.76" xml:space="preserve" style="--delay:1.5s">...:%@%@@@@@%%###+:..*#::.........................</text>
    <text class="ascii print-line" x="30" y="366.12" xml:space="preserve" style="--delay:1.5s">..-@@@@%%%%=::=##:..+%%%%-........................</text>
    <text class="ascii print-line" x="30" y="381.48" xml:space="preserve" style="--delay:1.5s">..@@@@@%%%*++:::...+%#-...........................</text>
    <text class="ascii print-line" x="30" y="396.84" xml:space="preserve" style="--delay:1.5s">.-@@@@@@%+*%*+=...-%:.............................</text>
    <text class="ascii print-line" x="30" y="412.2"  xml:space="preserve" style="--delay:1.5s">..@@@@@@%%#=%%%*.:%#..............................</text>
    <text class="ascii print-line" x="30" y="427.56" xml:space="preserve" style="--delay:1.5s">..=@@@@@@@%%%*%%%%%+..............................</text>
    <text class="ascii print-line" x="30" y="442.92" xml:space="preserve" style="--delay:1.5s">...=@@@@@@@@%%%*+%#...............................</text>
    <text class="ascii print-line" x="30" y="458.28" xml:space="preserve" style="--delay:1.5s">....:#@@@@#%%=%%%#................................</text>
    <text class="ascii print-line" x="30" y="473.64" xml:space="preserve" style="--delay:1.5s">......:*%@@@@@%*:.................................</text>
    <text class="ascii print-line" x="30" y="489"    xml:space="preserve" style="--delay:1.5s">............:.....................................</text>
 
    <!-- Texto: espacamento original, apenas deslocado para x=402 -->
    <text class="print-line" x="402" y="105" xml:space="preserve" style="--delay:1.5s"><tspan class="header">fabiofetch</tspan><tspan class="sep"> ----------------------------------------</tspan></text>
    <text class="print-line" x="402" y="129" xml:space="preserve" style="--delay:2s"><tspan class="label">OS: </tspan><tspan class="value">Windows, Linux</tspan></text>
    <text class="print-line" x="402" y="149" xml:space="preserve" style="--delay:2.5s"><tspan class="label">Uptime: </tspan><tspan class="value">24 years</tspan></text>
    <text class="print-line" x="402" y="169" xml:space="preserve" style="--delay:3s"><tspan class="label">Host: </tspan><tspan class="value">Aveiro, Portugal</tspan></text>
    <text class="print-line" x="402" y="189" xml:space="preserve" style="--delay:3.5s"><tspan class="label">Kernel: </tspan><tspan class="value">Cybersecurity Analyst</tspan></text>
    <text class="print-line" x="402" y="209" xml:space="preserve" style="--delay:4s"><tspan class="label">IDE: </tspan><tspan class="value">Neovim btw :)</tspan></text>
    <text class="print-line" x="402" y="229" xml:space="preserve" style="--delay:4.5s"><tspan class="label">Colorscheme: </tspan><tspan class="value">Catppuccin Frappe</tspan></text>
    <text class="print-line" x="402" y="265" xml:space="preserve" style="--delay:5s"><tspan class="label">Languages.Real: </tspan><tspan class="value">Portuguese, English</tspan></text>
    <text class="print-line" x="402" y="285" xml:space="preserve" style="--delay:5.5s"><tspan class="label">Languages.Programming: </tspan><tspan class="value">C/C++, Bash, Python, Java</tspan></text>
    <text class="print-line" x="402" y="321" xml:space="preserve" style="--delay:6s"><tspan class="label">Software.Dev: </tspan><tspan class="value">Docker, Git</tspan></text>
    <text class="print-line" x="402" y="341" xml:space="preserve" style="--delay:6.5s"><tspan class="label">Software.Infra: </tspan><tspan class="value">Ansible, ElasticSearch, Grafana, Prometheus</tspan></text>
    <text class="print-line" x="402" y="361" xml:space="preserve" style="--delay:7s"><tspan class="label">Software.Cyber: </tspan><tspan class="value">Nmap, Burpsuite, Wazuh, Ghidra</tspan></text>
    <text class="print-line" x="402" y="397" xml:space="preserve" style="--delay:7.5s"><tspan class="label">Contact.Website: </tspan><tspan class="value">https://www.fabirino.com</tspan></text>
    <text class="print-line" x="402" y="417" xml:space="preserve" style="--delay:8s"><tspan class="label">Contact.Linkedin: </tspan><tspan class="value">https://www.linkedin.com/in/fabirino/</tspan></text>
    <text class="print-line" x="402" y="453" xml:space="preserve" style="--delay:8.5s"><tspan class="label">Project.Active: </tspan><tspan class="value">Guitar Amp Reverse Engineering</tspan></text>
    <text class="print-line" x="402" y="489" xml:space="preserve" style="--delay:9s"><tspan class="label">Hobbies: </tspan><tspan class="value">Guitar, Gaming, CTFs</tspan></text>
  </g>
 
  <!-- Final prompt + blinking cursor -->
  <text x="30" y="530" class="prompt-sym final-prompt">~ $&gt;</text>
  <rect class="final-cursor" x="76" y="517" width="8" height="16"/>
</svg>
